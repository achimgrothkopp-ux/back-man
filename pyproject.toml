[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "back-man"
version = "0.1.1"
description = "Back-Man — Qt-basierter Backup-Manager für Linux auf Basis von restic"
requires-python = ">=3.10"
authors = [{ name = "Achim Grothkopp", email = "achimgrothkopp@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "PySide6>=6.6",
    "keyring>=24",
    "pydantic>=2.5",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
back-man = "backman.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
